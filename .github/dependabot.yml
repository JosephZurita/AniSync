version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:17"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "Shoko.Abstractions"
      - dependency-name: "Shoko.BuildTools.Targets"
    groups:
      shoko-plugin-api:
        patterns:
          - "Shoko.*"
    commit-message:
      prefix: "build"
      include: "scope"
